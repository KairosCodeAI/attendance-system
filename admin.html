<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - 출석 집계 시스템</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-tab="attendance" id="tab-attendance"><i data-lucide="layout-dashboard"></i> 출석 현황 대시보드</a>
                <a href="#" class="nav-item" data-tab="register" id="tab-register"><i data-lucide="users"></i> 학생 관리 (수강신청)</a>
                <a href="#" class="nav-item" data-tab="settings" id="tab-settings"><i data-lucide="settings"></i> 시스템 설정</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-title">출석 현황 대시보드</div>
                <button id="refreshBtn" class="btn-primary"><i data-lucide="refresh-cw"></i> 새로고침</button>
            </header>

            <div class="content-wrapper">
                <!-- Notice Card -->
                <div class="notice-card">
                    <div class="notice-icon"><i data-lucide="bell"></i></div>
                    <div class="notice-text">
                        <h3>관리자 알림</h3>
                        <p>출석을 시작하기 전에 구글 스프레드시트 <strong>'설정'</strong> 시트의 <strong>B1</strong> 셀에 <strong>오늘의 출석 코드</strong>를 설정해주세요.</p>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i data-lucide="users"></i></div>
                        <div class="stat-info">
                            <span class="stat-label">오늘 총 출석 인원</span>
                            <span class="stat-value" id="today-total">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i data-lucide="clock"></i></div>
                        <div class="stat-info">
                            <span class="stat-label">최근 출석 시간</span>
                            <span class="stat-value" id="last-attendance">-</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i data-lucide="book-open"></i></div>
                        <div class="stat-info">
                            <span class="stat-label">전체 출석 기록 수</span>
                            <span class="stat-value" id="total-records">0</span>
                        </div>
                    </div>
                </div>

                <!-- Data Table Section -->
                <div class="table-card">
                    <div class="table-header">
                        <h3>최근 출석 기록</h3>
                    </div>
                    
                    <div id="loading-spinner" class="loading-container">
                        <i data-lucide="loader-2" class="spinner"></i>
                        <p>데이터를 불러오는 중입니다...</p>
                    </div>

                    <div class="table-container" id="table-container" style="display: none;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>타임스탬프</th>
                                    <th>학번</th>
                                    <th>이름</th>
                                    <th>수강 과목</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Data will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Settings Section -->
                <div class="settings-card" id="settings-container" style="display: none; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); padding: 30px; border-radius: 16px; margin-top: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);">
                    <h3 style="margin-bottom: 20px; color: #1e1e1e;">시스템 설정</h3>
                    <div style="margin-bottom: 20px;">
                        <label for="current-code" style="display: block; margin-bottom: 8px; color: #666; font-size: 14px;">현재 출석 코드</label>
                        <input type="text" id="current-code" readonly style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; background: #f5f5f5; color: #333; font-size: 16px;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label for="new-code" style="display: block; margin-bottom: 8px; color: #666; font-size: 14px;">새로운 출석 코드 변경</label>
                        <input type="text" id="new-code" placeholder="예: 4자리 숫자 입력" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #c7d2fe; font-size: 16px; outline: none;">
                    </div>
                    <button id="updateCodeBtn" style="padding: 12px 24px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;">출석 코드 변경하기</button>
                </div>
            </div>
        </main>
    </div>
    <script src="admin.js?v=3"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
