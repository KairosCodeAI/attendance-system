<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학생 수강신청</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
    <!-- Background Animated Blobs -->
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header class="header">
            <h1>수강신청</h1>
            <p>수강할 과목을 신청해주세요</p>
        </header>

        <form id="registerForm" class="glass-form">
            <div class="input-group">
                <label for="studentName">이름</label>
                <input type="text" id="studentName" placeholder="홍길동" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="studentId">학번</label>
                <input type="text" id="studentId" placeholder="예: 20230101" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>수강 과목 <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">(다중 선택 가능)</span></label>
                <div class="checkbox-grid">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="course" value="인공지능">
                        <span class="checkmark"></span>
                        <span class="label-text">인공지능</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="course" value="미술">
                        <span class="checkmark"></span>
                        <span class="label-text">미술</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="course" value="음악">
                        <span class="checkmark"></span>
                        <span class="label-text">음악</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="course" value="체육">
                        <span class="checkmark"></span>
                        <span class="label-text">체육</span>
                    </label>
                    <label class="custom-checkbox">
                        <input type="checkbox" name="course" value="요리">
                        <span class="checkmark"></span>
                        <span class="label-text">요리</span>
                    </label>
                </div>
            </div>
            
            <button type="submit" id="submitBtn" class="submit-btn">
                <span class="btn-text">신청하기</span>
                <span class="loader"></span>
            </button>
        </form>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="register.js?v=2"></script>
</body>
</html>
